name: Deploy Fafurion Preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Use original HQ Fafurion background
        run: |
          sed -i 's#assets/fafurion-bg.webp#assets/fafurion-bg.jpg#g' index.html
          sed -i 's#transform:scale(1.035);#transform:scale(1.015);#g' index.html
          sed -i 's#scale(1.075) translate3d(-.8%,.6%,0)#scale(1.035) translate3d(-.35%,.25%,0)#g' index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
